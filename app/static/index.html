<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kos Digital · Saung Neglasari</title>
<style>
  :root{--bg:#f4f3ee;--card:#fff;--ink:#13263f;--mut:#5b6b7d;--line:#e0ded6;--navy:#1b3a5c;--gold:#e3a33b;--teal:#1f6f7a;--bad:#b3402f;--ok:#2d7a4f}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1b2b;--card:#17283d;--ink:#eef1f4;--mut:#9fb0c2;--line:#2a3d55}}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
  header{background:var(--navy);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0}
  .header-actions{display:flex;align-items:center;gap:8px}
  main{max-width:960px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  h2{font-size:17px;margin:0 0 12px}
  label{display:block;font-size:13px;color:var(--mut);margin:8px 0 2px}
  input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
  button{padding:9px 14px;border:0;border-radius:8px;background:var(--navy);color:#fff;font:inherit;cursor:pointer}
  button.alt{background:var(--gold);color:#1a1a1a}button.sm{padding:5px 10px;font-size:13px}button.bad{background:var(--bad)}
  nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  nav button{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:6px 12px}nav button.on{background:var(--navy);color:#fff}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
  @media (max-width:480px){
    header h1{font-size:15px}
    .row{grid-template-columns:1fr}
  }
  .tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:600}
  .pill{padding:2px 10px;border-radius:99px;font-size:12px;background:var(--line)}
  .Lunas{background:#cfe9d9;color:#1d5a37}.Ditolak{background:#f3d3cd;color:#8a2c1e}.Menunggu{background:#fbe6bd;color:#6b4a00}
  #toast{position:fixed;bottom:16px;left:16px;right:16px;max-width:420px;margin:auto;background:#222;color:#fff;padding:12px;border-radius:10px;display:none}
  .hide{display:none}
</style>
</head>
<body>
<header><h1>Kos Digital · Saung Neglasari</h1><div class="header-actions"><span id="who"></span><button id="logout" class="sm alt hide">Keluar</button></div></header>
<main>
  <section id="login" class="card" style="max-width:380px;margin:40px auto">
    <h2>Masuk</h2>
    <label>Username</label><input id="u" autocomplete="username">
    <label>Password</label><input id="p" type="password" autocomplete="current-password">
    <p><button id="go">Masuk</button></p>
  </section>

  <section id="app" class="hide">
    <nav id="tabs"></nav>
    <div id="view"></div>
  </section>
</main>
<div id="toast"></div>
<script>
let token = null, role = null, tab = null, editKamarId = null;
const $ = s => document.querySelector(s);
const rp = n => "Rp" + Number(n).toLocaleString("id-ID");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",3500)}

async function api(path, opt = {}) {
  const h = opt.headers || {};
  if (token) h.Authorization = "Bearer " + token;
  if (opt.json) { h["Content-Type"] = "application/json"; opt.body = JSON.stringify(opt.json); }
  const r = await fetch(path, {...opt, headers: h});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ("Kesalahan " + r.status));
  return data;
}
const pill = s => `<span class="pill ${s.split(" ")[0]}">${esc(s)}</span>`;

$("#go").onclick = async () => {
  try {
    const d = await api("/login", {method: "POST", json: {username: $("#u").value, password: $("#p").value}});
    token = d.token; role = d.role;
    $("#login").classList.add("hide"); $("#app").classList.remove("hide"); $("#logout").classList.remove("hide");
    $("#who").textContent = role === "admin" ? "Admin" : "Penghuni";
    const tabs = role === "admin" ? ["Tagihan","Kamar","Penghuni","Pesan","Rekap"] : ["Tagihan saya"];
    $("#tabs").innerHTML = tabs.map(t => `<button data-t="${t}">${t}</button>`).join("");
    $("#tabs").onclick = e => e.target.dataset.t && show(e.target.dataset.t);
    show(tabs[0]);
  } catch (e) { toast(e.message); }
};
$("#logout").onclick = () => location.reload();
document.addEventListener("keydown", e => { if (e.key === "Enter" && !$("#login").classList.contains("hide")) $("#go").click(); });

async function show(t) {
  tab = t;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  try { $("#view").innerHTML = await views[t](); (after[t] || (() => {}))(); } catch (e) { toast(e.message); }
}
const thisMonth = () => new Date().toISOString().slice(0, 7);

const views = {
  async "Tagihan"() {
    const rows = await api("/tagihan");
    return `<div class="card"><h2>Buat tagihan periode</h2><div class="row">
      <input id="per" value="${thisMonth()}" placeholder="YYYY-MM"><button id="gen">Buat tagihan</button></div></div>
      <div class="card"><h2>Daftar tagihan</h2><div class="tablewrap"><table><tr><th>Periode</th><th>Kamar</th><th>Penghuni</th><th>Jumlah</th><th>Jatuh tempo</th><th>Status</th><th></th></tr>` +
      rows.map(r => `<tr><td>${r.periode}</td><td>${esc(r.kamar)}</td><td>${esc(r.nama)}</td><td>${rp(r.jumlah)}</td><td>${r.jatuh_tempo}</td><td>${pill(r.status)}</td><td>
        ${r.status === "Menunggu verifikasi" ? `<button class="sm" data-bukti="${r.id}">Lihat bukti</button> ` : ""}
        ${["Belum dibayar","Menunggu verifikasi"].includes(r.status) ? `<button class="sm" data-set="Lunas" data-id="${r.id}">Lunas</button> ` : ""}
        ${r.status === "Menunggu verifikasi" ? `<button class="sm bad" data-set="Ditolak" data-id="${r.id}">Tolak</button>` : ""}</td></tr>`).join("") +
      `</table></div></div>`;
  },
  async "Kamar"() {
    const rows = await api("/kamar");
    return `<div class="card"><h2>Tambah kamar</h2><div class="row">
      <input id="kn" placeholder="Nomor"><input id="kl" type="number" placeholder="Lantai" value="1"><input id="kc" type="number" placeholder="Kapasitas" value="1">
      <input id="kf" placeholder="Fasilitas"><input id="kt" type="number" placeholder="Tarif"><button id="addk">Simpan</button></div></div>
      <div class="card"><div class="tablewrap"><table><tr><th>Nomor</th><th>Lantai</th><th>Kapasitas</th><th>Fasilitas</th><th>Tarif</th><th>Status</th><th></th></tr>` +
      rows.map(r => `<tr><td>${esc(r.nomor)}</td><td>${r.lantai}</td><td>${r.kapasitas}</td><td>${esc(r.fasilitas)}</td><td>${rp(r.tarif)}</td><td>${r.status}</td>
        <td><button class="sm" data-ke="${r.id}" data-n="${esc(r.nomor)}" data-l="${r.lantai}" data-c="${r.kapasitas}" data-f="${esc(r.fasilitas)}" data-t="${r.tarif}">Edit</button>
        <button class="sm bad" data-kdel="${r.id}" data-n="${esc(r.nomor)}">Hapus</button></td></tr>`).join("") + `</table></div></div>`;
  },
  async "Penghuni"() {
    const [rows, kamar] = await Promise.all([api("/penghuni"), api("/kamar")]);
    return `<div class="card"><h2>Tambah penghuni</h2><div class="row">
      <input id="pn" placeholder="Nama"><input id="pw" placeholder="No. WhatsApp (628…)"><input id="pt" type="date">
      <select id="pk">${kamar.map(k => `<option value="${k.id}">${esc(k.nomor)}</option>`).join("")}</select>
      <input id="pu" placeholder="Username"><input id="pp" type="password" placeholder="Password awal (min 8)">
      <label style="margin:0;display:flex;gap:6px;align-items:center"><input id="po" type="checkbox" style="width:auto">Setuju terima WA</label>
      <button id="addp">Simpan</button></div></div>
      <div class="card"><div class="tablewrap"><table><tr><th>Nama</th><th>Kamar</th><th>No. WA</th><th>Masuk</th><th>Status</th><th></th></tr>` +
      rows.map(r => `<tr><td>${esc(r.nama)}</td><td>${esc(r.kamar)}</td><td>${esc(r.no_wa)}</td><td>${r.tgl_masuk}</td><td>${r.aktif ? "aktif" : "nonaktif"}</td>
        <td>${r.aktif ? `<button class="sm bad" data-off="${r.id}">Nonaktifkan</button>` : ""}</td></tr>`).join("") + `</table></div></div>`;
  },
  async "Pesan"() {
    const rows = await api("/pesan");
    return `<div class="card"><h2>Pengingat WhatsApp</h2><p style="color:var(--mut);margin-top:0">Jalur manual: sistem menyiapkan teks, Anda menekan Kirim.</p>
      <button id="remind">Jalankan pengingat</button></div>
      <div class="card"><div class="tablewrap"><table><tr><th>Waktu</th><th>Penghuni</th><th>Status</th><th></th></tr>` +
      rows.map(r => `<tr><td>${r.waktu.replace("T"," ")}</td><td>${esc(r.nama)}</td><td>${r.status_kirim}${r.keterangan ? " · " + esc(r.keterangan) : ""}</td><td>
        ${r.status_kirim === "antri" ? `<a href="https://wa.me/${encodeURIComponent(r.no_wa)}?text=${encodeURIComponent(r.isi)}" target="_blank" rel="noopener"><button class="sm alt" data-sent="${r.id}">Kirim</button></a>` : ""}</td></tr>`).join("") + `</table></div></div>`;
  },
  async "Rekap"() {
    return `<div class="card"><h2>Rekapitulasi</h2><div class="row"><input id="rp" value="${thisMonth()}"><button id="rk">Tampilkan</button></div><div id="rkout"></div></div>`;
  },
  async "Tagihan saya"() {
    const rows = await api("/tagihan");
    return `<div class="card"><h2>Tagihan saya</h2>` + (rows.length ? rows.map(r => `
      <div style="border-top:1px solid var(--line);padding:12px 0"><b>${r.periode}</b> · ${rp(r.jumlah)} · jatuh tempo ${r.jatuh_tempo}<br>${pill(r.status)}
      ${["Belum dibayar","Ditolak"].includes(r.status) ? `<p><input type="file" accept=".jpg,.jpeg,.png,.pdf" data-file="${r.id}"> <button class="sm" data-up="${r.id}">Unggah bukti</button></p>` : ""}</div>`).join("") : "<p>Belum ada tagihan.</p>") + `</div>`;
  },
};

const after = {};
document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  try {
    if (b.id === "gen") { const d = await api("/tagihan/generate", {method:"POST", json:{periode:$("#per").value}}); toast(`Dibuat ${d.dibuat}, dilewati ${d.dilewati}`); show(tab); }
    else if (b.dataset.set) { await api(`/tagihan/${b.dataset.id}/status`, {method:"PATCH", json:{status:b.dataset.set}}); show(tab); }
    else if (b.dataset.bukti) { const r = await fetch(`/tagihan/${b.dataset.bukti}/bukti`, {headers:{Authorization:"Bearer "+token}}); if(!r.ok) throw new Error("Bukti tidak tersedia"); window.open(URL.createObjectURL(await r.blob())); }
    else if (b.id === "addk") { const j = {nomor:$("#kn").value, lantai:+$("#kl").value, kapasitas:+$("#kc").value, fasilitas:$("#kf").value, tarif:+$("#kt").value};
      if (editKamarId) { await api(`/kamar/${editKamarId}`, {method:"PATCH", json:j}); toast("Kamar diperbarui"); editKamarId = null; }
      else { await api("/kamar", {method:"POST", json:j}); toast("Kamar disimpan"); }
      show(tab); }
    else if (b.dataset.ke) { editKamarId = b.dataset.ke; $("#kn").value = b.dataset.n; $("#kl").value = b.dataset.l; $("#kc").value = b.dataset.c; $("#kf").value = b.dataset.f; $("#kt").value = b.dataset.t;
      $("#addk").textContent = "Perbarui kamar " + b.dataset.n; $("#kn").scrollIntoView({behavior:"smooth", block:"center"}); }
    else if (b.dataset.kdel) { if (!confirm(`Hapus kamar ${b.dataset.n}?`)) return; await api(`/kamar/${b.dataset.kdel}`, {method:"DELETE"}); toast("Kamar dihapus"); show(tab); }
    else if (b.id === "addp") { await api("/penghuni", {method:"POST", json:{nama:$("#pn").value, no_wa:$("#pw").value, tgl_masuk:$("#pt").value, kamar_id:+$("#pk").value, username:$("#pu").value, password:$("#pp").value, persetujuan_wa:$("#po").checked}}); toast("Penghuni disimpan"); show(tab); }
    else if (b.dataset.off) { await api(`/penghuni/${b.dataset.off}/nonaktif`, {method:"PATCH"}); show(tab); }
    else if (b.id === "remind") { const d = await api("/pengingat/jalankan", {method:"POST"}); toast(`Antrean dibuat ${d.dibuat}, terkirim ${d.terkirim}, gagal ${d.gagal}`); show(tab); }
    else if (b.dataset.sent) { await api(`/pesan/${b.dataset.sent}/tandai-terkirim`, {method:"POST"}); setTimeout(() => show(tab), 500); }
    else if (b.id === "rk") { const d = await api("/laporan/rekap?periode=" + encodeURIComponent($("#rp").value));
      $("#rkout").innerHTML = `<p>Total ${d.total.jumlah_tagihan} tagihan (${rp(d.total.nominal)}) · Lunas ${d.lunas.jumlah_tagihan} (${rp(d.lunas.nominal)}) · <b>Tunggakan ${d.tunggakan.jumlah_tagihan} (${rp(d.tunggakan.nominal)})</b></p>` +
      `<div class="tablewrap"><table><tr><th>Kamar</th><th>Nama</th><th>Status</th><th>Jumlah</th></tr>${d.tunggakan.daftar.map(x=>`<tr><td>${esc(x.kamar)}</td><td>${esc(x.nama)}</td><td>${esc(x.status)}</td><td>${rp(x.jumlah)}</td></tr>`).join("")}</table></div>`; }
    else if (b.dataset.up) { const f = document.querySelector(`[data-file="${b.dataset.up}"]`).files[0]; if (!f) throw new Error("Pilih file dulu");
      const fd = new FormData(); fd.append("file", f); await api(`/tagihan/${b.dataset.up}/bukti`, {method:"POST", body: fd}); toast("Bukti terunggah, menunggu verifikasi"); show(tab); }
  } catch (err) { toast(err.message); }
});
</script>
</body>
</html>
